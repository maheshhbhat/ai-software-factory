name: Story
description: Single bounded work unit for one worker invocation. Planning-generated (simulated by hand in Phase 1).
title: "[Story] "
labels: ["type:story", "story:blocked"]
body:
  - type: markdown
    attributes:
      value: |
        Generated by planning (by hand in Phase 1). Initial state is `story:blocked` — exactly one `story:*` label at a time. All fields below are authoritative in the issue body per `factory/spec/state-schema.md`. Mirror `phase:*` / `hazard` as labels for queryability.
  - type: textarea
    id: spec
    attributes:
      label: Spec
      description: Bounded spec for this story — what to build, not how the worker reasons.
      placeholder: As a user I can ... so that ... . Includes inputs, outputs, edge cases, and out-of-scope.
    validations:
      required: true
  - type: input
    id: project_ref
    attributes:
      label: Project
      description: Parent project issue.
      placeholder: "#0"
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      description: Story phase (declared at authoring; also apply phase:<name> label).
      multiple: false
      options:
        - build
        - ship
        - shadow
        - cutover
        - hardening
      default: 0
    validations:
      required: true
  - type: textarea
    id: depends_on
    attributes:
      label: Depends-on
      description: Explicit dependencies on other story issues in the same project. List as #N. Leave as "none" if unblocked.
      placeholder: |
        - #0
        - #0
      value: "none"
    validations:
      required: true
  - type: checkboxes
    id: hazard
    attributes:
      label: Hazard
      description: Check if this story touches a hazard path (secrets/credentials, dependency manifests, CI/workflow, branch protection, IAM, data migrations, destructive ops, factory/spec or factory/gates). If checked, also apply the `hazard` label.
      options:
        - label: Touches hazard path
  - type: input
    id: attempt
    attributes:
      label: Attempt
      description: Attempt counter. Starts at 0; increments on each in-review → ready (findings). At 3 → story:blocked:poison.
      placeholder: "0"
      value: "0"
    validations:
      required: true
  - type: input
    id: spend_cap
    attributes:
      label: Spend cap
      description: Per-invocation spend cap with unit (e.g. "$40", "60 min", "200k tokens"). Enforced in Phase 4.
      placeholder: e.g. "$40 / 60 min"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Declared diff scope as path globs. Future merge gate requires diff within scope.
      placeholder: |
        - src/reports/**
        - tests/reports/**
    validations:
      required: true
  - type: textarea
    id: acceptance_notes
    attributes:
      label: Acceptance notes
      description: How to verify this story in isolation.
      placeholder: Manual check or test that proves this story alone.
    validations:
      required: false
