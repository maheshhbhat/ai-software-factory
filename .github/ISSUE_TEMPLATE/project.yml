name: Project
description: Bounded delivery unit (5–10 stories) with falsifiable acceptance criteria. Planning-generated (simulated by hand in Phase 1).
title: "[Project] "
labels: ["type:project", "project:queued"]
body:
  - type: markdown
    attributes:
      value: |
        Generated by planning (by hand in Phase 1). Initial state is `project:queued` — exactly one `project:*` label at a time per `factory/spec/state-schema.md`. Goal and acceptance criteria are approved at `project:awaiting-ready`.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One-sentence project goal.
      placeholder: e.g. Users can export reports as valid PDF.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Falsifiable acceptance criteria
      description: 'Checklist — each item is a yes/no test. Bad: "Export works well." Good: "A 50+ page report exports to valid PDF in <30s."'
      placeholder: |
        - [ ] A 50+ page report exports to valid PDF in <30s
        - [ ] Export respects document permissions
        - [ ] Exported PDF passes preflight (fonts embedded, PDF/A valid)
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: stories
    attributes:
      label: Stories
      description: Links to story issues for this project (filled after planning).
      placeholder: |
        - #0
        - #0
    validations:
      required: false
  - type: input
    id: expected_bells
    attributes:
      label: Expected bells
      description: Estimated human bells for this project (plan-approval + acceptance + hazard/poison reserves).
      placeholder: "e.g. 3"
    validations:
      required: false
  - type: textarea
    id: risks
    attributes:
      label: Risks / notes
      description: Planning risks, coupling notes, ADR refs.
      placeholder: Risks, out-of-scope tradeoffs, ADR links.
    validations:
      required: false
  - type: input
    id: commitment_ref
    attributes:
      label: Roadmap commitment
      description: Parent commitment issue this project derives from.
      placeholder: "#0"
    validations:
      required: false
